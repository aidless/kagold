name: ci
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: |
          pip install -r requirements.txt
      - name: 门禁自检（36 项，含反证）
        run: python3 tests/selftest.py
